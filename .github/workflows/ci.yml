name: ci

# What a commit has to prove before it can be tagged. Three jobs, because they
# fail for different reasons and a reader wants to know which: `lint` is the
# shape of the code, `test` is what it does, `types` is what it claims.
#
# Every job compiles the Rust engine, so every job wants a Rust toolchain. The
# first one to run pays for the build; the cache keeps the rest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.5"
  OTP_VERSION: "29.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    # `mix docs` is a development task: ex_doc is a `:dev` dependency, so this
    # job runs in dev while `test` and `types` run in test.
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/cadmpeg_nif
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/native
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix docs

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/cadmpeg_nif
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/native
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix test

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/cadmpeg_nif
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/native
            priv/plts
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-plt-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix dialyzer
